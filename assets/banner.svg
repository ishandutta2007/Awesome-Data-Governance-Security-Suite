<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0d152e" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
    </pattern>

    <!-- Filter for subtle glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style><![CDATA[
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    /* Dynamic pulsing & flowing keyframes */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.9; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.5; }
      50% { transform: scale(1.2) translate(25px, -15px); opacity: 0.85; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .card-float-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .data-flow-line {
      stroke-dasharray: 6, 6;
      animation: dashLine 2s linear infinite;
    }
  ]]></style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Orbs (Behind content) -->
  <g class="orb-1">
    <circle cx="220" cy="120" r="180" fill="url(#glowGrad1)" filter="url(#softGlow)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="300" r="220" fill="url(#glowGrad2)" filter="url(#softGlow)" />
  </g>

  <!-- Animated Data Flow Lines (Background Layer) -->
  <g opacity="0.45">
    <path d="M 50 350 Q 300 280 600 350 T 1150 320" fill="none" stroke="#38bdf8" stroke-width="2" class="data-flow-line" />
    <path d="M 80 80 Q 400 140 700 80 T 1120 110" fill="none" stroke="#c084fc" stroke-width="2" class="data-flow-line" />
  </g>

  <!-- Floating Dynamic Tech Decorative Badges / Pills (Layered below text) -->
  <g class="card-float-1" opacity="0.85">
    <!-- Top Right Floating Pill -->
    <rect x="910" y="55" width="220" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)" />
    <circle cx="932" cy="76" r="6" fill="#38bdf8" />
    <text x="948" y="81" class="badge-text">🛡️ Access &amp; Compliance</text>
  </g>

  <g class="card-float-2" opacity="0.85">
    <!-- Bottom Right Floating Pill -->
    <rect x="880" y="325" width="240" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)" />
    <circle cx="902" cy="346" r="6" fill="#c084fc" />
    <text x="918" y="351" class="badge-text">🤖 Agentic Data Governance</text>
  </g>

  <g class="card-float-1" opacity="0.85">
    <!-- Bottom Left Floating Pill -->
    <rect x="70" y="335" width="200" height="42" rx="21" fill="#1e293b" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)" />
    <circle cx="92" cy="356" r="6" fill="#34d399" />
    <text x="108" y="361" class="badge-text">📊 Active Metadata &amp; Lineage</text>
  </g>

  <!-- Main Foreground Content Area -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Tagline Pill -->
    <g transform="translate(0, -65)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">
        ✦ ENTERPRISE DATA INTELLIGENCE &amp; SECURITY ✦
      </text>
    </g>

    <!-- Main Title (Gradient Foreground) -->
    <text x="0" y="15" text-anchor="middle" class="title-text" fill="url(#primaryGrad)" filter="url(#glow)">
      Awesome Data Governance &amp; Security Suite
    </text>

    <!-- Subtitle -->
    <text x="0" y="65" text-anchor="middle" class="subtitle-text">
      Curated Landscape of Enterprise SaaS Solutions &amp; Open-Source Security Ecosystems
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 115)">
      <g transform="translate(-310, 0)">
        <rect x="0" y="0" width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" />
        <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">📁 Catalogs &amp; Metadata</text>
      </g>
      <g transform="translate(-90, 0)">
        <rect x="0" y="0" width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" />
        <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8">🔐 Policy &amp; RBAC/ABAC</text>
      </g>
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" />
        <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc">⚖️ Privacy &amp; AI Posture</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>